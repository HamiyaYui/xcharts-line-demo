<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XChartsLineDemo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F4F6FB;
    }
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #F4F6FB;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "XChartsDemo",
      productName: "XChartsLineDemo",
      productVersion: "1.0",
      showBanner: function (msg, type) {
        if (type === "error") console.error(msg);
      }
    }).catch(function (err) {
      console.error(err);
    });
  </script>
</body>
</html>
